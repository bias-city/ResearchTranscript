[package]
name = "researchtranscript-app"
version = "0.6.1"
description = "ResearchTranscript — Tauri-Hülle mit eingebettetem Python (PyO3)"
authors = ["Ben Pohl / BIAS.City"]
edition = "2021"

[lib]
name = "researchtranscript_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# resolve-config: liest PYO3_CONFIG_FILE (die gebündelte Laufzeit,
# pyo3-config.txt) — nie das Dev-venv, nie Homebrew-Python.
pyo3-build-config = { version = "0.29", features = ["resolve-config"] }
# Swift-Paket RTMotoren (AVFoundation, LAME, SpeakerKit-Shim) statisch
# linken — nur mit Feature `motoren`
swift-rs = { version = "1.0.8", features = ["build"], optional = true }

[features]
# Motoren im Prozess (AVFoundation + LAME, SpeakerKit-Shim) über das
# Swift-Paket RTMotoren — ohne das Feature bleibt LT_MOTOR=kind der
# einzige Weg (Plan §5, Standard bis zur belegten Parität, E3).
motoren = ["dep:swift-rs"]
# Web-Inspector der Oberfläche. Gehört in den DMG-Kanal, nicht in die
# Store-Fassung: release-mas.mjs baut mit --no-default-features, damit ein
# eingereichtes Paket kein Entwicklerwerkzeug mitbringt.
devtools = ["tauri/devtools"]
default = ["motoren", "devtools"]
# Mac-App-Store-Fassung (scripts/release-mas.mjs): die Oberfläche blendet
# den Verweis auf GitHub-Releases aus (Aktualisierungen kommen über den
# Store, Guideline 2.4.5) und nennt die Zusatzerlaubnis.
mas = []

[dependencies]
# protocol-asset: Medien über asset:// (Phase 0, F2) statt HTTP
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Python im Prozess (docs/appstore-plan.md §4 1.7/1.8). Kein
# `auto-initialize`: ein früher Python::attach würde mit der
# Standard-Pfadsuche initialisieren, nicht mit unserer PyConfig.
pyo3 = { version = "0.29", features = [] }
# Security-scoped Bookmarks (Plan §6): NSURL aus Foundation
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSData", "NSError", "NSString"] }
libc = "0.2"
