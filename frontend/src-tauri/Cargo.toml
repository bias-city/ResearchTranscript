[package]
name = "researchtranscript-app"
version = "0.4.0"
description = "ResearchTranscript — Tauri-Shell (spawnt das Python-Backend)"
authors = ["Ben Pohl / BIAS.City"]
edition = "2021"

[lib]
name = "researchtranscript_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
pyo3-build-config = { version = "0.29", features = ["resolve-config"] }

[dependencies]
tauri = { version = "2", features = ["devtools", "protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Phase-0-Spike: Python im Prozess (docs/appstore-plan.md §3, F1)
pyo3 = { version = "0.29", features = [] }
