<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Spike F1</title>
<style>body{font:13px/1.4 -apple-system,sans-serif;margin:16px;color:#111}pre{background:#f4f4f5;padding:10px;border-radius:8px;white-space:pre-wrap;max-height:60vh;overflow:auto}
button{margin:0 6px 6px 0;padding:6px 10px}h1{font-size:16px}</style></head>
<body>
<h1>Phase 0 · F1: Python im Prozess der Hülle</h1>
<p><a href="f2.html">→ F2: Medien ohne HTTP-Server</a></p>
<p>Die Messungen 1–3 laufen beim Start selbst. Für Messung 4 bitte einen Ordner <b>ausserhalb</b> des Containers wählen, etwa den Schreibtisch.</p>
<button id="ordner">4 · Ordner wählen → Python liest und schreibt darin</button>
<button id="kind">5 · argmax-cli als Kindprozess (Sandbox + inherit)</button>
<button id="lang">6 · Dauerlauf 3 min (Jobs + Polling)</button>
<pre id="log"></pre>
<script>
const inv = (c, a) => window.__TAURI__.core.invoke(c, a || {});
const logEl = document.getElementById('log');
async function log(z) { const t = new Date().toISOString().slice(11, 23); logEl.textContent += `${t} ${z}\n`; try { await inv('spike_log', { zeile: `${t} ${z}` }); } catch {} }
const J = (o) => JSON.stringify(o);
async function messung123() {
  const t0 = performance.now();
  try {
    const h = await inv('spike_health'); await log(`1 health: ${J(h)} · Befehl ${(performance.now()-t0).toFixed(0)} ms nach Seitenstart`);
    const i = await inv('spike_import'); await log(`2 import: ${J(i)}`);
    const ids = await inv('spike_job_start', { anzahl: 4 }); await log(`3 jobs gestartet: ${J(ids)}`);
    let abgebrochen = false; const tA = performance.now(); let tAbbruch = null;
    for (let n = 0; n < 40; n++) {
      await new Promise(r => setTimeout(r, 500));
      const p = await inv('spike_job_poll');
      const kurz = p.jobs.map(j => `${j[0]}:${j[1]}:${j[2]}%`).join(' ');
      await log(`  poll ${p.poll_ms.toFixed(1)} ms · ticks ${p.ticks} · ${kurz}`);
      if (!abgebrochen && n === 3) { abgebrochen = true; tAbbruch = performance.now(); await log(`  abbrechen ${ids[0]} → ${await inv('spike_job_abbruch', { id: ids[0] })}`); }
      if (abgebrochen && p.jobs.find(j => j[0] === ids[0] && j[1] === 'cancelled') && tAbbruch) { await log(`  Abbruch wirksam nach ${(performance.now()-tAbbruch).toFixed(0)} ms`); tAbbruch = null; }
      if (p.jobs.every(j => ['completed','failed','cancelled'].includes(j[1]))) { await log(`3 alle Jobs beendet nach ${((performance.now()-tA)/1000).toFixed(1)} s`); break; }
    }
  } catch (e) { await log(`FEHLER 1–3: ${e}`); }
}
document.getElementById('ordner').onclick = async () => {
  try {
    const pfad = await inv('plugin:dialog|open', { options: { directory: true, multiple: false } });
    if (!pfad) { await log('4 kein Ordner gewählt'); return; }
    const r = await inv('spike_ordner', { pfad }); await log(`4 ordner ${pfad}: ${J(r)}`);
  } catch (e) { await log(`FEHLER 4: ${e}`); }
};
document.getElementById('kind').onclick = async () => { try { await log(`5 kind: ${J(await inv('spike_kind_argmax'))}`); } catch (e) { await log(`FEHLER 5: ${e}`); } };
document.getElementById('lang').onclick = async () => {
  try {
    const bis = performance.now() + 180000; let runden = 0, max = 0;
    while (performance.now() < bis) { const t = performance.now(); await inv('spike_job_poll'); max = Math.max(max, performance.now()-t); runden++; await new Promise(r => setTimeout(r, 250)); }
    await log(`6 dauerlauf: ${runden} Abfragen in 3 min, längste ${max.toFixed(1)} ms`);
  } catch (e) { await log(`FEHLER 6: ${e}`); }
};
window.addEventListener('DOMContentLoaded', () => { log('Seite geladen'); messung123(); });
</script></body></html>
