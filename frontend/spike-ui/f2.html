<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Spike F2</title>
<style>body{font:13px/1.4 -apple-system,sans-serif;margin:16px;color:#111}pre{background:#f4f4f5;padding:10px;border-radius:8px;white-space:pre-wrap;max-height:40vh;overflow:auto}
button{margin:0 6px 6px 0;padding:6px 10px}h1{font-size:16px}video,audio{display:block;max-width:640px;margin:8px 0}</style></head>
<body>
<h1>Phase 0 · F2: Medien ohne HTTP-Server</h1>
<p><a href="index.html">← F1</a> · Datei wählen, dann läuft die Messung: fünf Sprünge, je Sprung Wartezeit bis <code>seeked</code> und ob es hakt (<code>waiting</code>).</p>
<button id="wahl">Mediendatei wählen (rtmedia://)</button>
<button id="asset">Gegenprobe: dieselbe Datei über asset:// (convertFileSrc)</button>
<div id="halter"></div>
<pre id="log"></pre>
<script>
const inv = (c, a) => window.__TAURI__.core.invoke(c, a || {});
const logEl = document.getElementById('log'); let letzter = null;
async function log(z) { const t = new Date().toISOString().slice(11, 23); logEl.textContent += `${t} ${z}\n`; try { await inv('spike_log', { zeile: `${t} F2 ${z}` }); } catch {} }
function element(pfad, src) {
  const h = document.getElementById('halter'); h.innerHTML = '';
  const video = /\.(mp4|m4v|mov)$/i.test(pfad);
  const el = document.createElement(video ? 'video' : 'audio');
  el.controls = true; el.preload = 'auto'; el.src = src; h.appendChild(el); return el;
}
async function messen(el, name) {
  const t0 = performance.now(); let waits = 0, stalls = 0;
  el.addEventListener('waiting', () => waits++); el.addEventListener('stalled', () => stalls++);
  await new Promise((r, x) => { el.addEventListener('loadedmetadata', r, { once: true }); el.addEventListener('error', () => x(new Error('error ' + (el.error && el.error.code))), { once: true }); });
  await log(`${name}: metadata nach ${(performance.now()-t0).toFixed(0)} ms, Dauer ${el.duration.toFixed(1)} s`);
  await el.play().catch(e => log(`${name}: play → ${e}`));
  await new Promise(r => setTimeout(r, 1500));
  const d = el.duration; const ziele = [0.83, 0.12, 0.55, 0.97, 0.31].map(f => f * d);
  for (const z of ziele) {
    const t = performance.now(); el.currentTime = z;
    const ok = await new Promise(r => { const to = setTimeout(() => r(false), 8000); el.addEventListener('seeked', () => { clearTimeout(to); r(true); }, { once: true }); });
    await log(`${name}: Sprung auf ${z.toFixed(1)} s → ${ok ? 'seeked' : 'TIMEOUT'} nach ${(performance.now()-t).toFixed(0)} ms, waiting=${waits} stalled=${stalls}`);
    await new Promise(r => setTimeout(r, 1200));
  }
  el.pause(); await log(`${name}: fertig, readyState=${el.readyState}, waiting=${waits}, stalled=${stalls}`);
}
document.getElementById('wahl').onclick = async () => {
  try {
    const pfad = await inv('plugin:dialog|open', { options: { multiple: false, filters: [{ name: 'Medien', extensions: ['mp3','m4a','wav','flac','mp4','mov','m4v'] }] } });
    if (!pfad) return; letzter = pfad;
    const key = await inv('spike_medien_registrieren', { pfad });
    const el = element(pfad, `rtmedia://localhost/${key}`); await messen(el, 'rtmedia');
  } catch (e) { await log(`FEHLER rtmedia: ${e}`); }
};
document.getElementById('asset').onclick = async () => {
  try {
    if (!letzter) { await log('erst eine Datei wählen'); return; }
    const src = window.__TAURI__.core.convertFileSrc(letzter);
    const el = element(letzter, src); await messen(el, 'asset');
  } catch (e) { await log(`FEHLER asset: ${e}`); }
};
window.addEventListener('error', e => log(`JS-FEHLER ${e.message} @${e.lineno}`));
window.addEventListener('unhandledrejection', e => log(`JS-REJECT ${e.reason}`));
async function auto() {
  new Image().src = 'rtmedia://localhost/ping-seite-geladen';
  await log(`auto: Start, __TAURI__=${typeof window.__TAURI__}`);
  const h = await inv("spike_health"); const tmp = h.home + "/tmp/";
  for (const name of ["spike-media.mp3", "spike-media.mp4"]) {
    const pfad = tmp + name; let key;
    try { key = await inv("spike_medien_registrieren", { pfad }); } catch (e) { await log(`auto: ${name} fehlt (${e})`); continue; }
    try { const el = element(pfad, `rtmedia://localhost/${key}`); el.muted = true; await messen(el, `rtmedia ${name}`); } catch (e) { await log(`FEHLER rtmedia ${name}: ${e}`); }
    try { const el = element(pfad, window.__TAURI__.core.convertFileSrc(pfad)); el.muted = true; await messen(el, `asset ${name}`); } catch (e) { await log(`FEHLER asset ${name}: ${e}`); }
  }
  await log("auto: ENDE");
}
auto();
</script></body></html>
