[project]
name = "researchtranscript"
version = "0.4.0"
description = "ResearchTranscript — offline Transkription (whisper.cpp) mit Sprecher-Diarisierung, Editor und enrich-Export"
# 3.13 wie die gebündelte Laufzeit (Plan 1.3): das Dev-venv soll dieselbe
# Sprache sprechen wie die App — vorher 3.12 hier, 3.13 im Bundle.
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
# Nur, was die App IM PROZESS braucht (api.py + Logik). Der HTTP-Server
# ist ein Extra für Browser-Dev, Playwright und pytest (`serve`) und
# kommt nicht mehr ins Bundle.
dependencies = [
    "pydantic>=2.7",
    "enrich-core",
    # Die Sprechertrennung läuft seit 2.5.0 über die mitgelieferte
    # SpeakerKit-Kommandozeile (Core ML) — kein torch, kein SpeechBrain.
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5",
       "fastapi>=0.111", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[tool.uv.sources]
# enrich-core ist seit 2026-09-11 ein eigenes, öffentliches Paket (MIT):
# https://github.com/bias-city/enrich-core — der Format-Kern des
# .enrich-Dossiers. Gebaut und getestet wird gegen den getaggten Stand;
# der Geschwister-Checkout ../enrich dient nur noch dem Drift-Guard für
# turns.py (enrich-serve/textimport).
# Der gebaute App-Bundle-venv trägt es mit; ein frischer Clone braucht
# ../enrich (README).
enrich-core = { git = "https://github.com/bias-city/enrich-core", tag = "v0.1.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchtranscript"]

[tool.ruff]
line-length = 79
# Gevendorte enrich-Bausteine bleiben BYTE-IDENTISCH zur Quelle
# (Drift-Guard-Test) — ruff darf sie nie "fixen".
exclude = ["src/researchtranscript/enrich_export/turns.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# FastAPI-Idiom (B008 File(...)), bewusste returncode-Prüfungen statt
# check=True, Vendor-Code-Stil — keine echten Defekte.
ignore = ["B008", "S110", "PLW1510", "ASYNC230"]
